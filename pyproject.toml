[build-system]
requires = ["setuptools>=61"]
build-backend = "backend"
backend-path = ["."]

[project]
name = "poc-revshell-oast"
version = "0.1.0"
description = "PoC: cross-platform pip-install callback to OAST listener"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kisman"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
