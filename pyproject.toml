[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-revshell"
version = "0.0.1"
description = "poc revshell"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "poc"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://example.invalid/poc-revshell"

[tool.setuptools.packages.find]
where = ["."]
include = ["poc_revshell*"]
